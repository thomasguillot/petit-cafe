name: PetitCafe
options:
  bundleIdPrefix: com.petitcafe
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
packages:
  PetitCafeKit:
    path: ../PetitCafeKit
targets:
  PetitCafe:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: PetitCafeKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Petit Café
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        LSMultipleInstancesProhibited: true
        NSHumanReadableCopyright: "© 2026 Thomas Guillot · MIT-Licensed"
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            cd "$SRCROOT/.." && swiftlint lint --quiet
          else
            echo "note: SwiftLint not installed; skipping lint (brew install swiftlint)."
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.petitcafe.app
        PRODUCT_NAME: "Petit Café"
        # codesign rejects the bundle when the Mach-O name carries the accent, so keep it ASCII.
        EXECUTABLE_NAME: PetitCafe
        ARCHS: arm64
        PRODUCT_MODULE_NAME: PetitCafe
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        # Keeps get-task-allow (a debugging entitlement) out of the app people download.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        CODE_SIGNING_REQUIRED: NO
